<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>Reply to client — Anand Kumar Rai</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, Arial, sans-serif;
      background: #0a0a0a;
      color: #f5f5f0;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at top, #201111 0, #0a0a0a 55%);
    }

    main {
      width: min(100%, 640px);
      padding: clamp(24px, 6vw, 48px);
      border: 1px solid #292323;
      background: #111;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #ff4545;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 6vw, 44px);
      letter-spacing: -.045em;
    }

    .intro {
      margin: 0 0 32px;
      color: #aaa;
      line-height: 1.6;
    }

    form { display: grid; gap: 20px; }

    label {
      display: grid;
      gap: 8px;
      color: #c8c8c2;
      font-size: 13px;
      font-weight: 600;
    }

    input, textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #363636;
      border-radius: 2px;
      outline: none;
      background: #0a0a0a;
      color: #f5f5f0;
      font: inherit;
      font-size: 15px;
    }

    input:focus, textarea:focus { border-color: #ff4545; }
    textarea { min-height: 180px; resize: vertical; line-height: 1.6; }

    button {
      min-height: 48px;
      padding: 12px 18px;
      border: 0;
      background: #ff2e2e;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: #d91e1e; }
    button:disabled { cursor: wait; opacity: .65; }

    #status { min-height: 24px; margin: 0; font-size: 14px; }
    #status.error { color: #ff7777; }
    #status.success { color: #83d69a; }

    .back-link { display: inline-block; margin-top: 24px; color: #aaa; font-size: 13px; }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Anand Kumar Rai · Email reply</p>
    <h1>Reply to client</h1>
    <p class="intro">Write your reply below. It will be sent to the client through EmailJS.</p>

    <form id="replyForm">
      <label for="to_email">
        Client email
        <input id="to_email" name="to_email" type="email" autocomplete="email" required>
      </label>
      <label for="to_name">
        Client name
        <input id="to_name" name="to_name" type="text" autocomplete="name">
      </label>
      <label for="subject">
        Subject
        <input id="subject" name="subject" type="text" value="Re: Your message" required>
      </label>
      <label for="message">
        Your reply
        <textarea id="message" name="message" required></textarea>
      </label>
      <button id="sendButton" type="submit">Send reply</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>

    <a class="back-link" href="https://anandrai-nine.vercel.app/">← Back to portfolio</a>
  </main>

  <script>
    (function () {
      const EMAILJS_PUBLIC_KEY = 'kfqvss3JpVr-urbZW';
      const EMAILJS_SERVICE_ID = 'service_hjllqke';
      const EMAILJS_TEMPLATE_ID = 'template_t4rx6bk';
      const OWNER_NAME = 'Anand Kumar Rai';
      const OWNER_EMAIL = 'anandrai5941@gmail.com';

      const form = document.getElementById('replyForm');
      const emailInput = document.getElementById('to_email');
      const nameInput = document.getElementById('to_name');
      const subjectInput = document.getElementById('subject');
      const messageInput = document.getElementById('message');
      const sendButton = document.getElementById('sendButton');
      const status = document.getElementById('status');

      const params = new URLSearchParams(window.location.search);
      emailInput.value = params.get('to_email') || '';
      nameInput.value = params.get('to_name') || '';

      if (typeof emailjs !== 'undefined') {
        emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        if (typeof emailjs === 'undefined') {
          status.className = 'error';
          status.textContent = 'Email service is unavailable. Please try again later.';
          return;
        }

        sendButton.disabled = true;
        sendButton.textContent = 'Sending...';
        status.className = '';
        status.textContent = '';

        const recipientEmail = emailInput.value.trim();
        const recipientName = nameInput.value.trim() || recipientEmail;
        const templateParams = {
          to_email: recipientEmail,
          to_name: recipientName,
          from_name: OWNER_NAME,
          from_email: OWNER_EMAIL,
          reply_to: OWNER_EMAIL,
          subject: subjectInput.value.trim(),
          message: messageInput.value.trim(),
          sent_time: new Date().toLocaleString('en-IN', {
            dateStyle: 'medium',
            timeStyle: 'short'
          })
        };

        emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
          .then(function () {
            status.className = 'success';
            status.textContent = 'Reply sent successfully.';
            messageInput.value = '';
          })
          .catch(function (error) {
            console.error('EmailJS reply error:', error);
            status.className = 'error';
            status.textContent = 'Could not send the reply. Please try again.';
          })
          .finally(function () {
            sendButton.disabled = false;
            sendButton.textContent = 'Send reply';
          });
      });
    })();
  </script>
</body>
</html>
